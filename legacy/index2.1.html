    /* 风格延续 zonelets.net：米色纸面、衬线、单栏窄版 */
    :root {

    * { margin: 0; padding: 0; box-sizing: border-box; }

    .masthead h1 a { color: var(--ink); text-decoration: none; }
    .masthead .sub { color: var(--faded); font-size: .9rem; margin-top: 6px; }
    .masthead nav { margin-top: 14px; font-size: .95rem; }
    .masthead nav a {
        color: var(--accent);
        text-decoration: none;
        margin: 0 10px;
        border-bottom: 1px solid transparent;
    }
    .masthead nav a:hover { border-bottom-color: var(--accent); }

    /* 栏目标签卡 */
    .topics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 8px;
    }
    .topic-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 22px 20px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: #fffef9;
        text-decoration: none;
        color: var(--ink);
        transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .topic-card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        box-shadow: 0 6px 18px rgba(194, 87, 28, .08);
    }
    .topic-card h2 { font-size: 1.25rem; margin: 0; color: var(--accent); }
    .topic-card p {
        font-size: .95rem;
        line-height: 1.7;
        color: #56544c;
        margin: 0;
        flex: 1;
    }
    .topic-more { font-size: .88rem; color: var(--faded); }
    .topic-card:hover .topic-more { color: var(--accent); }

    footer {
        text-align: center;
        color: var(--faded);
        font-size: .88rem;
        margin-top: 48px;
    }
    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 600px) {
