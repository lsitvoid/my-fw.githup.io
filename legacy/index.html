<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST的小宇宙</title>
    <meta name="description" content="LIST 的小宇宙：铃兰小姐是我们的光">
    <link rel="icon" type="image/avif" href="../tupian/xiaot.avif">
    <style>
    /* 风格参考 antfu.me：暗色、居中窄栏、克制装饰；
       背景为明日方舟拉普兰德视频，海报帧为铃兰 */
    :root {
        --bg: #0b0c0f;
        --text: #d6d3cd;
        --dim: #8a8880;
        --gold: #ffcf7d;
        --line: rgba(255,255,255,.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }

    html { background: var(--bg); }

    body {
        font-family: 'Noto Sans CJK SC', 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        line-height: 1.8;
    }

    /* 背景视频层：压暗保证文字可读 */
    .bg-video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
        filter: brightness(.38) saturate(1.05);
    }
    /* 视频不可用时的兜底：铃兰动图 */
    .bg-fallback {
        position: fixed;
        inset: 0;
        background: url('../tupian/suzuran-bg.webp') center / cover no-repeat;
        filter: brightness(.4);
        z-index: -3;
    }
    /* 顶部与底部的暗角，聚焦中央内容 */
    .bg-vignette {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
            linear-gradient(rgba(11,12,15,.55), rgba(11,12,15,.15) 30%, rgba(11,12,15,.15) 65%, rgba(11,12,15,.7));
    }

    nav.top {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px;
        padding: 18px 12px;
    }
    nav.top a {
        color: var(--dim);
        text-decoration: none;
        font-size: .95rem;
        padding: 6px 14px;
        border-radius: 8px;
        transition: color .2s, background-color .2s;
    }
    nav.top a:hover { color: var(--gold); background: rgba(255,207,125,.07); }

    .wrap {
        max-width: 640px;
        width: 100%;
        margin: 0 auto;
        padding: 0 24px;
        flex: 1;
    }

    header.hero { padding: 9vh 0 8vh; text-align: left; }
    .hero .kicker {
        color: var(--gold);
        font-size: .85rem;
        letter-spacing: .35em;
        margin-bottom: 14px;
    }
    .hero h1 {
        font-size: clamp(2.2rem, 6vw, 3.2rem);
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: .04em;
    }
    .hero h1 em {
        font-style: normal;
        background: linear-gradient(120deg, #ffcf7d, #ff9d5c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .hero .sub { color: var(--dim); margin-top: 14px; font-size: 1rem; }

    /* 语录打字机 */
    .quote-line {
        margin-top: 20px;
        color: var(--text);
        font-size: .98rem;
        min-height: 1.8em;
    }
    .quote-line::before { content: '“ '; color: var(--gold); }
    .quote-line::after  { content: ' ▍'; color: var(--gold); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* 栏目列表：antfu 式极简列表，非卡片堆砌 */
    section { border-top: 1px solid var(--line); padding: 34px 0; }
    section h2 {
        font-size: .95rem;
        color: var(--dim);
        font-weight: 400;
        letter-spacing: .2em;
        margin-bottom: 18px;
    }
    .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        text-decoration: none;
        color: var(--text);
        border-bottom: 1px dashed transparent;
        transition: border-color .2s;
    }
    .row:hover { border-bottom-color: var(--gold); }
    .row .name { font-size: 1.08rem; }
    .row .name .tag {
        color: var(--gold);
        font-size: .8rem;
        margin-left: 8px;
    }
    .row .desc { color: var(--dim); font-size: .9rem; text-align: right; }

    .gallery { display: flex; gap: 12px; margin-top: 8px; }
    .gallery img {
        width: calc(50% - 6px);
        border-radius: 10px;
        border: 1px solid var(--line);
    }

    blockquote {
        color: var(--dim);
        padding-left: 14px;
        border-left: 2px solid var(--gold);
        margin-bottom: 12px;
        font-size: .95rem;
    }

    .fab {
        position: fixed;
        right: 20px;
        bottom: 20px;
        color: var(--gold);
        text-decoration: none;
        font-size: .9rem;
        border: 1px solid rgba(255,207,125,.35);
        border-radius: 24px;
        padding: 9px 18px;
        background: rgba(11,12,15,.55);
        backdrop-filter: blur(8px);
        transition: background-color .2s;
        z-index: 50;
    }
    .fab:hover { background: rgba(255,207,125,.12); }

    footer {
        text-align: center;
        color: var(--dim);
        font-size: .82rem;
        padding: 22px 0 26px;
    }
    footer a { color: var(--gold); text-decoration: none; }

    @media (prefers-reduced-motion: reduce) {
        .bg-video { display: none; }   /* 省流动效：只留铃兰静图 */
        .quote-line::after { animation: none; }
    }
    @media (max-width: 600px) {
        header.hero { padding: 6vh 0 6vh; }
        .row { flex-direction: column; gap: 2px; }
        .row .desc { text-align: left; }
        .gallery { flex-direction: column; }
        .gallery img { width: 100%; }
    }
    </style>
</head>
<body>

    <div class="bg-vignette"></div>

    <script>

    <script src="media/siren-player.js"></script>
    <script>
    // 语录打字机循环
    const quotes = [
        '代码是写给未来自己的情书',
        '像素是数字世界的粘土',
        '遇事不决，可问春风',
        '真正的智慧在于知道自己一无所知'
    ];
    const el = document.getElementById('quote');
    let qi = 0, ci = 0, deleting = false;
    (function tick() {
        const q = quotes[qi];
        el.textContent = q.slice(0, ci);
        if (!deleting && ci < q.length)      { ci++; setTimeout(tick, 120); }
        else if (!deleting)                  { deleting = true; setTimeout(tick, 2200); }
        else if (ci > 0)                     { ci--; setTimeout(tick, 40); }
        else                                 { deleting = false; qi = (qi+1) % quotes.length; setTimeout(tick, 500); }
    })();
    </script>
</body>
</html>
