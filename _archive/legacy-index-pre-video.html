<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST的小宇宙</title>
    <link rel="icon" type="image/avif" href="../tupian/xiaot.avif">
    <link rel="stylesheet" href="css/style.css">
    <style>
    /* 移动端适配补丁（原 style.css 无任何 @media） */
    @media (max-width: 900px) {
        /* 左右 fixed 侧栏回归文档流 */
        .sidebar-card, .function-card {
            position: static;
            width: auto;
            max-width: 420px;
            margin: 16px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .function-card { order: 3; }
        .function-item { width: auto; }
        .function-tooltip { display: none; }   /* 触屏无 hover，提示无意义 */

        .welcome-container {
            height: 46vh;
            background-attachment: scroll;
        }
        .welcome-text { font-size: 2rem; }

        .content {
            top: 0;
            padding: 1rem;
            margin: 0 auto;
            max-width: 640px;
        }

        /* 抽屉：顶部滑入改为常驻顶部横条 */
        .drawer {
            position: static;
            top: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 8px;
        }

        .copyright-box {
            position: static;
            text-align: center;
            padding: 16px 0;
        }
    }
    </style>
</head>
<body>
    <!-- 抽屉导航 -->
    <nav class="drawer" id="drawer">
        <a href="../index.html" class="drawer-item">主页</a>
        <a href="#quotes" class="drawer-item">📜 语录集</a>
        <a href="#game" class="drawer-item">🎮 游戏项目</a>
        <a href="#custom" class="drawer-item">✨ 小屋</a>
    </nav>

    <!-- 用户卡片 -->
    <div class="sidebar-card">
        <img src="../tupian/169959361.jpg" alt="用户头像" class="avatar">
        <h3 class="username">LSIT的博客</h3>
        <div class="nav-card"><p class="nav-title">界面一</p></div>
        <div class="nav-card"><p class="nav-title">界面二</p></div>
        <div class="nav-card active"><p class="nav-title">界面三</p></div>
    </div>

    <!-- 功能卡片 -->
    <div class="function-card">
        <div class="function-item" data-action="toggle-theme">
            <span>切换主题</span>
            <div class="function-tooltip">一键切换亮暗主题</div>
        </div>
        <div class="function-item" data-action="focus-search">
            <span>快速搜索</span>
            <div class="function-tooltip">全站内容搜索</div>
        </div>
        <div class="function-item">
            <a href="Reward.html"><span>打赏喵&gt;_&lt;</span></a>
            <div class="function-tooltip">请作者喝杯奶茶</div>
        </div>
    </div>

    <!-- 欢迎横幅 -->
    <div class="welcome-container">
        <h1 class="welcome-text">欢迎</h1>
    </div>
    <div class="quote-list">
        "代码是写给未来自己的情书"
        "像素是数字世界的粘土"
    </div>

    <!-- 内容区域 -->
    <main class="content">
        <section id="quotes" class="page">
            <h2>📜 语录集</h2>
            <div class="quotes-container">
                <blockquote>真正的智慧在于知道自己一无所知</blockquote>
                <blockquote>代码是诗人写给机器的情书</blockquote>
            </div>
        </section>

        <section id="game" class="page">
            <h2>🎮 游戏项目</h2>
            <div class="project-card">
                <h3>访仙</h3>
                <p>使用 godot 开发的 2D 游戏</p>
                <a href="indexyouxi.html">看看</a>
            </div>
        </section>

        <section id="custom" class="page">
            <h2>✨ 小屋</h2>
            <div class="custom-content">
                <blockquote>铃兰小姐是我们的光</blockquote>
                <img src="tupian/1.webp" alt="小屋一" loading="lazy">
                <img src="tupian/2.webp" alt="小屋二" loading="lazy">
            </div>
        </section>
    </main>

    <div class="copyright-box">
        <p>© LSIT的博客</p>
        <p>
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">图片均来自网络</a><br>
            <a href="https://github.com/lsitvoid" target="_blank" rel="noopener">github 联系我</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
