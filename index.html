<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小世界中转站</title>
    <meta name="description" content="LIST 的个人主页：铃兰、剑来与朋友们">
    <meta property="og:title" content="小世界中转站">
    <meta property="og:description" content="LIST 的个人主页">
    <link rel="icon" type="image/avif" href="tupian/xiaot.avif">
    <link rel="preload" as="image" href="tupian/3.webp">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: opacity .3s ease, transform .3s ease, background-color .3s ease, right .35s cubic-bezier(.2,.9,.3,1);
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            opacity: 0;
        }

        .welcome-container {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            background:
                linear-gradient(45deg, rgba(255,107,107,.1), rgba(78,205,196,.1)),
                url('tupian/3.webp') no-repeat center center;
            background-size: cover;
            isolation: isolate;
        }

        .welcome-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.15);
            z-index: -1;
        }

        .main-content {
            flex: 1;
            display: flex;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* 用户卡片 */
        .user-card {
            flex: 0 0 300px;
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.1);
            margin-top: 60px;
            cursor: pointer;
        }

        .user-card:hover .avatar { transform: scale(1.05); }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,.2);
            object-fit: cover;
            margin-bottom: 16px;
        }

        .username {
            color: #fff;
            font-size: 1.5em;
            margin-bottom: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,.2);
        }

        .user-bio {
            color: rgba(255,255,255,.85);
            line-height: 1.6;
        }

        /* 导航卡片 */
        .nav-cards {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 60px;
        }

        .nav-card {
            flex: 1 1 300px;
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,.1);
            cursor: pointer;
            min-width: 280px;
        }

        .nav-card:hover, .nav-card:focus-visible {
            transform: translateY(-5px);
            background: rgba(255,255,255,.1);
            outline: 2px solid rgba(255,255,255,.4);
        }

        .nav-title {
            color: #fff;
            font-size: 1.25em;
            margin-bottom: 8px;
        }

        .nav-desc {
            color: rgba(255,255,255,.75);
            line-height: 1.5;
        }

        /* 右下角抽屉卡片：悬停 / 点按展开 */
        .drawer-card {
            position: fixed;
            bottom: 20px;
            right: -180px;              /* 收起：只露图片 */
            width: 250px;
            height: 100px;
            border-radius: 8px 0 0 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,.2);
            display: flex;
            overflow: hidden;
            z-index: 9999;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,.5);
        }

        .drawer-card:hover, .drawer-card.open { right: 20px; }

        .card-image {
            flex: 0 0 120px;
            background-color: #dbc3b4;
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid #4e3a2f;
        }

        .card-text {
            flex: 1;
            padding: 10px 8px;
            background: #f9f3e9;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-text h4 {
            margin: 0 0 4px;
            font-size: 1rem;
            font-weight: 600;
            color: #44362a;
            white-space: nowrap;
        }

        .card-text p {
            margin: 0;
            font-size: .75rem;
            color: #6b4f3c;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 减少动效偏好 */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }

        /* 移动端 */
        @media (max-width: 992px) {
            .main-content { flex-direction: column; align-items: center; }
            .user-card { flex: none; width: 90%; max-width: 400px; margin: 0 auto 40px; }
            .nav-cards { width: 100%; justify-content: center; }
            .welcome-container { background-attachment: scroll; }
        }

        @media (max-width: 480px) {
            .nav-card { flex-basis: 100%; }
            /* 触屏无 hover：收得更浅，露出一角提示可点 */
            .drawer-card { right: -200px; }
            .drawer-card.open { right: 12px; }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="main-content">
            <div class="user-card" onclick="navigateTo('5')"
                 role="link" tabindex="0" aria-label="进入 theend 页面">
                <img src="tupian/169959361.jpg" alt="头像" class="avatar">
                <h2 class="username">LIST</h2>
                <p class="user-bio">我不喜欢这个世界<br>但我|任然满怀热情</p>
            </div>

            <div class="nav-cards">
                <div class="nav-card" onclick="navigateTo('1')" role="link" tabindex="0">
                    <h3 class="nav-title">一个铃兰的页面</h3>
                    <p class="nav-desc">铃兰小姐是我们的光 <br>本页面对小屏设备不太友好</p>
                </div>
                <div class="nav-card" onclick="navigateTo('2')" role="link" tabindex="0">
                    <h3 class="nav-title">魔法书</h3>
                    <p class="nav-desc">这是正经的，不用担心</p>
                </div>
                <div class="nav-card" onclick="navigateTo('3')" role="link" tabindex="0">
                    <h3 class="nav-title">铃兰百科</h3>
                    <p class="nav-desc">一个为铃兰写的网站</p>
                </div>
                <div class="nav-card" onclick="navigateTo('4')" role="link" tabindex="0">
                    <h3 class="nav-title">友链</h3>
                    <p class="nav-desc">我的盆友们都在哪呢？</p>
                </div>
            </div>
        </div>

        <div class="drawer-card" id="drawer"
             onclick="toggleDrawer(event)" role="button" tabindex="0"
             aria-label="庆祝剑来，点按展开">
            <div class="card-image" style="background-image: url('tupian/jianlai.webp');"></div>
            <div class="card-text">
                <h4>庆祝剑来</h4>
                <p>遇事不决，可问春风。<a href="./legacy/jianlai/index.html">剑来</a></p>
            </div>
        </div>
    </div>

    <script>
    // 页面路由：全部指向 legacy/
    const PATH_CONFIG = {
        base: 'legacy/',
        pages: {
            1: 'index.html',
            2: 'index2.1.html',
            3: 'Failed Album/index.html',
            4: 'indexyou.html',
            5: 'theend/index-y.html'
        }
    };

    function navigateTo(pageId) {
        const path = PATH_CONFIG.pages[pageId];
        if (!path) return;
        const url = PATH_CONFIG.base + path;
        // 优先走 pjax 换体：跨页不断播
        if (window.__spjax) { window.spjaxTo(url); return; }
        window.location.href = url;
    }

    // 触屏没有 hover：点一下展开抽屉；已展开则交给链接自然跳转
    function toggleDrawer(ev) {
        if (window.matchMedia('(hover: hover)').matches) return;  // 有鼠标走 CSS hover
        const d = document.getElementById('drawer');
        if (!d.classList.contains('open')) {
            ev.preventDefault();
            d.classList.add('open');
        }
    }

    // 键盘可达：Enter/空格 触发 role=link/button 的卡片
    document.querySelectorAll('[role="link"], [role="button"]').forEach(el => {
        el.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
        });
    });

    // 首屏淡入：不阻塞在图片上，加载窗口即显示
    window.addEventListener('load', () => { document.body.style.opacity = 1; });
    setTimeout(() => { document.body.style.opacity = 1; }, 1500);  // 兜底
    </script>
    <script src="legacy/media/siren-pjax.js"></script>
    <script src="legacy/media/siren-player.js"></script>
</body>
</html>
